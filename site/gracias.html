<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gracias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<style>
main{max-width:560px;margin:0 auto;padding:72px 22px}
h1{font-size:clamp(2.4rem,7vw,3.4rem);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin:24px 0}
.card p{margin:0 0 6px}
.big{font-family:"Cormorant",Georgia,serif;font-size:1.6rem;font-weight:600}
</style>
</head>
<body>
<main id="m"><p class="muted">Confirmando tu pago…</p></main>
<script>
const m = document.getElementById("m");
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const id = new URLSearchParams(location.search).get("s");
try { sessionStorage.removeItem("reservaPendiente"); } catch (e) {}
const volver = () => { const a = el("a", "btn btn-line", "Volver a la página"); a.href = "/"; return a; };
async function revisar(intento = 0) {
  let d;
  try { const r = await fetch("/api/pedido?s=" + encodeURIComponent(id || "")); d = await r.json(); if (!r.ok) throw new Error(d.error); }
  catch (e) { m.replaceChildren(el("h1", null, "Algo no salió bien"), el("p", "muted", "No pude confirmar tu compra desde aquí. Si se hizo el cobro, te llegó un recibo por correo; escríbeme y lo resolvemos."), volver()); return; }
  if (!d.pagado) {
    if (intento < 5) return setTimeout(() => revisar(intento + 1), 2000);
    m.replaceChildren(el("h1", null, "Tu pago está en proceso"), el("p", "muted", "Todavía no se confirma. Si ya pagaste, te llegará un recibo por correo en unos minutos."), volver()); return;
  }
  if (d.tipo === "reserva") {
    const c = el("div", "card");
    c.append(el("p", "big", d.lectura), el("p", null, `${d.fecha}, ${d.hora} (hora de Texas)`), el("p", "muted", "Por videollamada"));
    const out = [el("h1", null, `¡Listo, ${d.nombre}!`), el("p", null, "Tu lectura quedó reservada y pagada.")];
    if (d.conflicto) out.push(el("p", "note err", "Alguien tomó ese mismo horario segundos antes que tú. No te preocupes: te escribiré por WhatsApp para darte otro horario o devolverte tu dinero."));
    out.push(c, el("p", null, "Antes de tu cita te escribiré por WhatsApp con el enlace de la videollamada. También te llegó el recibo a tu correo."), volver());
    m.replaceChildren(...out); return;
  }
  if (d.tipo === "pdf") {
    const a = el("a", "btn btn-solid", "Descargar mi PDF"); a.href = d.descarga;
    const c = el("div", "card"); c.append(el("p", "big", d.titulo), el("p", "muted", "Tu enlace funciona durante 30 días. Guarda el archivo en tu teléfono o computadora."));
    m.replaceChildren(el("h1", null, "¡Gracias por tu compra!"), c, a, el("p", "muted", " "), volver()); return;
  }
  m.replaceChildren(el("h1", null, "¡Gracias!"), volver());
}
revisar();
</script>
</body>
</html>
