<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gracias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/iconos/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
<meta name="theme-color" content="#1A2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Queen">
<link rel="stylesheet" href="/estilo.css">
<style>
main{max-width:560px;margin:0 auto;padding:72px 22px}
h1{font-size:clamp(2.4rem,7vw,3.4rem);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin:24px 0}
.card p{margin:0 0 6px}
.big{font-family:"Cormorant",Georgia,serif;font-size:1.6rem;font-weight:600}
.mensaje{border-color:#E9C46A;background:#FFFBEF}
.mensaje p{margin:0 0 12px;line-height:1.6}
.mensaje p:last-child{margin:0}
</style>
</head>
<body>
<main id="m"><p class="muted">Confirmando tu pago…</p></main>
<script src="/hora.js"></script>
<script>
const m = document.getElementById("m");
const $m = n => "$" + Number(n || 0).toFixed(2).replace(/\.00$/, "");
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const id = new URLSearchParams(location.search).get("s");
const MENSAJE = "Gracias por reservar tu lectura con Queen Spiritual. Es un honor para mí acompañarte en este espacio de conexión espiritual.\n\nAntes de tu cita te envío por correo el enlace de tu sala privada de videollamada. A la hora de tu cita, ábrelo desde tu teléfono o tu computadora y permite la cámara y el micrófono. No necesitas instalar nada.\n\nPara prepararte: busca un lugar tranquilo donde puedas estar a solas y con buena señal de internet. Llega con el corazón abierto para recibir los mensajes de tus guías espirituales y ancestros.\n\nCon cariño y bendiciones,\nQueen 👑";
try { sessionStorage.removeItem("reservaPendiente"); } catch (e) {}
const volver = () => { const a = el("a", "btn btn-line", "Volver a la página"); a.href = "/"; return a; };
const cap1 = t => t ? t[0].toUpperCase() + t.slice(1) : t;
async function revisar(intento = 0) {
  let d;
  try { const r = await fetch("/api/pedido?s=" + encodeURIComponent(id || "")); d = await r.json(); if (!r.ok) throw new Error(d.error); }
  catch (e) { m.replaceChildren(el("h1", null, "Algo no salió bien"), el("p", "muted", "No pude confirmar tu compra desde aquí. Si se hizo el cobro, te llegó un recibo por correo; escríbeme y lo resolvemos."), volver()); return; }
  if (!d.pagado) {
    if (intento < 5) return setTimeout(() => revisar(intento + 1), 2000);
    m.replaceChildren(el("h1", null, "Tu pago está en proceso"), el("p", "muted", "Todavía no se confirma. Si ya pagaste, te llegará un recibo por correo en unos minutos."), volver()); return;
  }
  if (d.tipo === "reserva") {
    const c = el("div", "card");
    c.append(el("p", "big", d.lectura), el("p", null, window.Hora && d.fechaR ? cap1(Hora.cuando(d.fechaR, d.horaR)) + " (tu hora)" : `${d.fecha}, ${d.hora}`), el("p", "muted", "Videollamada en tu sala privada"));
    const out = [el("h1", null, `¡Gracias por reservar, ${d.nombre}!`), el("p", null, "Tu lectura quedó reservada y pagada.")];
    if (d.conflicto) out.push(el("p", "note err", "Alguien tomó ese mismo horario segundos antes que tú. No te preocupes: te escribiré por WhatsApp para darte otro horario o devolverte tu dinero."));
    const msg = el("div", "card mensaje");
    try { const L = await (await fetch("/api/contenido?n=lecturas")).json(); (String(L.mensajeGracias || "").trim() || MENSAJE).split(/\n\s*\n/).forEach(b => { const p = el("p"); b.trim().split("\n").forEach((ln, i) => { if (i) p.append(document.createElement("br")); p.append(ln); }); msg.append(p); }); } catch (e) {}
    out.push(c);
    if (msg.childNodes.length) out.push(msg);
    out.push(el("p", "muted", `Te envié la confirmación${d.email ? " a " + d.email : ""}, con el botón para cancelar o cambiar tu cita.`));
    if (d.gestion) { const g = el("a", "btn btn-solid", "Administrar mi cita"); g.href = d.gestion; out.push(g, el("span", null, " ")); }
    out.push(volver());
    m.replaceChildren(...out); return;
  }
  if (d.tipo === "arreglo") {
    try { localStorage.removeItem("queenArreglo"); } catch (e) {}
    const c = el("div", "card");
    c.append(el("p", "big", d.arreglo || "Arreglo personalizado"), el("p", null, `Para el ${d.fecha}`)); if (d.flores.length) c.append(el("p", "muted", "Tus flores favoritas: " + d.flores.join(", ")));
    c.append(el("p", null, d.entrega === "entrega" ? `Entrega en: ${d.lugar}` : "Lo recoges conmigo; te escribo para coordinar la hora."));
    const pg = el("div", "card"); pg.append(el("p", null, `Total del arreglo: ${$m(d.total)}`), el("p", null, `Pagaste: ${$m(d.pagado)}`), el("p", "big", d.saldo ? `Saldo pendiente: ${$m(d.saldo)}` : "Pagado por completo"));
    m.replaceChildren(el("h1", null, `¡Tu arreglo está confirmado, ${d.nombre}!`), el("p", null, `Pedido ${d.numero}. Te envié la confirmación a ${d.email}.`), c, pg, el("p", "muted", d.saldo ? "El saldo se paga antes de la entrega. Te escribo para coordinarlo." : "¡Gracias! Te escribo antes de tu evento."), volver());
    return;
  }
  if (d.tipo === "saldo") {
    m.replaceChildren(el("h1", null, "¡Recibí tu pago!"), el("div", "card"), volver());
    m.children[1].append(el("p", "big", `Arreglo para el ${d.fecha}`), el("p", null, d.saldo ? `Saldo pendiente: ${$m(d.saldo)}` : "Tu arreglo está pagado por completo."));
    return;
  }
  if (d.tipo === "tienda") {
    try { localStorage.removeItem("queenCart"); } catch (e) {}
    const out = [el("h1", null, "¡Gracias por tu compra!")];
    const dig = d.items.filter(i => i.digital), fis = d.items.filter(i => !i.digital);
    if (dig.length) {
      const c = el("div", "card");
      c.append(el("p", "big", dig.length > 1 ? "Tus descargas" : "Tu descarga"));
      dig.forEach(i => { const a = el("a", "btn btn-solid", "Descargar: " + i.titulo); a.href = i.descarga; a.style.margin = "10px 10px 0 0"; c.append(a); });
      c.append(el("p", "muted", "Los enlaces funcionan durante 30 días. Guarda los archivos en tu teléfono o computadora."));
      c.lastChild.style.marginTop = "14px";
      out.push(c);
    }
    if (fis.length) {
      const c = el("div", "card");
      c.append(el("p", "big", "Tu pedido"));
      fis.forEach(i => c.append(el("p", null, `${i.cantidad} × ${i.titulo}`)));
      if (d.entrega === "envio") {
        c.append(el("p", "muted", "Lo enviaré a: " + (d.direccion || "la dirección que pusiste") + "."));
        if (d.paqueteria) c.append(el("p", "muted", "Envío por " + d.paqueteria + ". Te mando el número de rastreo cuando salga."));
      }
      else c.append(el("p", "muted", d.recogerTexto || "Te escribo por WhatsApp para coordinar la entrega."));
      out.push(c);
    }
    out.push(el("p", "muted", "También te llegó el recibo a tu correo."), volver());
    m.replaceChildren(...out); return;
  }
  m.replaceChildren(el("h1", null, "¡Gracias!"), volver());
}
revisar();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
<script src="/stats.js" defer></script>
</body>
</html>
