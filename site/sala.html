<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu sala privada · Queen Spiritual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/iconos/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
<meta name="theme-color" content="#141B33">
<link rel="stylesheet" href="/estilo.css">
<style>
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2E4F9A 0%,#1A2340 50%,#0F1428 100%) fixed;color:#fff;display:flex;flex-direction:column;min-height:100dvh}
.cab{display:flex;align-items:center;justify-content:center;padding:12px 16px calc(10px);padding-top:max(12px,env(safe-area-inset-top))}
.cab .brand{color:#fff}
.zona{flex:1;display:flex;flex-direction:column;min-height:0}
.bienvenida{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.caja{width:100%;max-width:460px;text-align:center;background:rgba(255,255,255,.06);border:1.5px solid #D4AE52;border-radius:22px;padding:28px 22px;box-shadow:0 0 40px rgba(212,174,82,.15)}
.kick{display:block;font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FFD966;margin-bottom:8px}
h1{font-family:"Cormorant",Georgia,serif;font-size:2.4rem;line-height:1.05;margin:0 0 6px;color:#fff}
.sub{color:#D9DFF0;margin:0 0 18px}
.tips{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px;text-align:left}
.tips li{display:flex;gap:10px;font-size:.95rem;color:#E6EAF7}
.tips li::before{content:"✦";color:#FFD966;flex:none}
.entrar{width:100%;padding:16px 20px;border:0;border-radius:14px;background:linear-gradient(100deg,#FFD966,#E9B949);color:#1A2340;font:inherit;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(255,217,102,.25)}
.entrar[disabled]{opacity:.7}
.err{color:#FFD0D0;margin:12px 0 0}
.tu-nombre{display:grid;gap:6px;text-align:left;margin:0 0 16px;font-weight:600}
.tu-nombre input{font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:#fff;color:#1A2340}
.aviso-app{background:#FFF7DA;color:#1A2340;border-radius:14px;padding:14px;margin:0 0 16px;text-align:left;font-size:.95rem;line-height:1.5}
.aviso-app b{display:block;margin-bottom:4px}
.aviso-app button{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1.5px solid #1A2340;background:#fff;color:#1A2340;font:inherit;font-weight:700;cursor:pointer}
.otra{display:block;margin-top:14px;color:#FFD966;font-weight:600;font-size:.92rem;background:none;border:0;font-family:inherit;cursor:pointer;text-decoration:underline;width:100%}
.barra{display:flex;justify-content:center;padding:0 10px 8px}
.barra a{color:#FFD966;font-size:.85rem;font-weight:600}
.video{flex:1;position:relative;min-height:0;padding:0 10px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.video iframe{width:100%;height:100%;min-height:calc(100dvh - 70px);border:1.5px solid #D4AE52;border-radius:16px;background:#0F1428;display:block}
@media (min-width:900px){.video{padding:0 24px 24px}.video iframe{min-height:calc(100dvh - 90px)}}
</style>
</head>
<body>
<header class="cab"><span class="brand">Queen Spiritual</span></header>
<main class="zona" id="zona">
  <div class="bienvenida"><div class="caja" id="caja"><p class="sub">Abriendo tu sala…</p></div></div>
</main>
<script>
const q = new URLSearchParams(location.search), S = q.get("s") || "", K = q.get("k") || "", E = q.get("e") || "";
const caja = document.getElementById("caja"), zona = document.getElementById("zona");
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const pedir = async (extra = "") => { const r = await fetch(E ? `/api/comunidad/sala?e=${encodeURIComponent(E)}${extra}` : `/api/sala?s=${encodeURIComponent(S)}&k=${encodeURIComponent(K)}${extra}`, { cache: "no-store", credentials: "same-origin" }); const d = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(d.error || "No pude abrir tu sala. Intenta de nuevo."); e.status = r.status; throw e; } return d; };
function mensaje(titulo, texto) { caja.replaceChildren(el("span", "kick", "Queen Spiritual"), el("h1", null, titulo), el("p", "sub", texto)); }
(async () => {
  if (!E && (!S || !K)) return mensaje("Enlace incompleto", "Revisa que copiaste el enlace completo que te mandé.");
  let d;
  try { d = await pedir(); } catch (e) {
    if (E && [401, 402, 403].includes(e.status)) { mensaje("Entra a tu cuenta", "Este encuentro es solo para miembros de la Comunidad Queen Spiritual. Entra a tu cuenta y vuelve a abrir este enlace."); const a = el("a", "entrar", "Entrar a la Comunidad"); a.href = "/comunidad.html"; a.style.display = "block"; a.style.textDecoration = "none"; caja.append(a); return; }
    return mensaje(e.status === 410 ? "Gracias por tu visita" : "No se pudo abrir", e.message);
  }
  const ul = el("ul", "tips");
  ["Busca un lugar tranquilo y con buena señal de internet.", "Cuando te lo pida, permite el uso de la cámara y el micrófono.", "Funciona desde tu teléfono o tu computadora, sin instalar nada."].forEach(t => ul.append(el("li", null, t)));
  const b = el("button", "entrar", "Entrar a mi sala"); b.type = "button";
  const directo = el("button", "otra", "¿No se abre la cámara? Entrar en pantalla completa"); directo.type = "button";
  const err = el("p", "err"); err.hidden = true;
  // Navegadores dentro de apps (Instagram, Facebook, WhatsApp, Gmail…) muchas veces no dejan usar la cámara.
  const ua = navigator.userAgent || "";
  const enApp = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Snapchat|TikTok|musical_ly|Twitter|GSA\/|; wv\)/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua);
  const aviso = el("div", "aviso-app");
  if (enApp) {
    aviso.append(el("b", null, "Para que funcione tu cámara:"), document.createTextNode(ios ? "Abre este enlace en Safari. Toca los tres puntitos (⋯) o el ícono de compartir y elige «Abrir en Safari»." : "Abre este enlace en Chrome. Toca los tres puntitos (⋮) y elige «Abrir en Chrome» o «Abrir en el navegador»."));
    const cp = el("button", null, "Copiar mi enlace"); cp.type = "button";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(location.href); cp.textContent = "Enlace copiado ✓ Pégalo en " + (ios ? "Safari" : "Chrome"); } catch (e) { prompt("Copia este enlace:", location.href); } };
    aviso.append(cp);
  } else aviso.hidden = true;
  // En una sala de grupo cada persona escribe su nombre (así lo ven las demás).
  let nom = null;
  if (d.grupo) { const L = document.createElement("label"); L.className = "tu-nombre"; L.append(el("span", null, "Tu nombre")); nom = document.createElement("input"); nom.type = "text"; nom.maxLength = 60; nom.autocomplete = "name"; nom.placeholder = "Así te verán en la videollamada"; try { nom.value = localStorage.getItem("qsNombre") || ""; } catch (e) {} L.append(nom); ul.after(L); }
  if (E) caja.replaceChildren(el("span", "kick", "Encuentro de la Comunidad"), el("h1", null, `Hola, ${d.nombre} 💛`), el("p", "sub", `${d.tema} · ${d.etiqueta} (hora de Texas)`), aviso, ul, b, directo, err);
  else if (d.grupo) caja.replaceChildren(el("span", "kick", "Sala de grupo · Queen Spiritual"), el("h1", null, d.nombre), el("p", "sub", "Bienvenida 💛"), aviso, ul, nom.parentNode, b, directo, err);
  else caja.replaceChildren(el("span", "kick", "Tu sala privada de lectura"), el("h1", null, `Hola, ${d.nombre} 💛`), el("p", "sub", d.servicio || "Lectura de cartas"), aviso, ul, b, directo, err);
  const conectar = async (modo, btn, texto) => {
    btn.disabled = true; const antes = btn.textContent; btn.textContent = "Conectando…"; err.hidden = true;
    try {
      if (nom && !nom.value.trim()) { nom.focus(); throw new Error("Escribe tu nombre para entrar."); }
      if (nom) { try { localStorage.setItem("qsNombre", nom.value.trim()); } catch (e) {} }
      const x = await pedir("&entrar=1" + (nom ? "&nombre=" + encodeURIComponent(nom.value.trim()) : ""));
      const url = `${x.url}?t=${encodeURIComponent(x.token)}`;
      if (modo === "directo") { location.href = url; return; }
      const fr = document.createElement("iframe");
      fr.allow = "camera *; microphone *; fullscreen *; autoplay *; display-capture *";
      fr.setAttribute("allowfullscreen", "");
      fr.title = "Tu videollamada con Queen Spiritual";
      fr.src = url;
      const v = el("div", "video"), barra = el("div", "barra"), a = el("a", null, "¿No ves la videollamada o tu cámara? Ábrela en pantalla completa");
      a.href = "#"; a.onclick = ev => { ev.preventDefault(); location.href = url; };
      barra.append(a); v.append(fr); zona.replaceChildren(barra, v);
    } catch (e) { err.textContent = e.message; err.hidden = false; btn.disabled = false; btn.textContent = antes; }
  };
  b.onclick = () => conectar("sala", b);
  directo.onclick = () => conectar("directo", directo);
})();
</script>
</body>
</html>
