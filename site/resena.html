<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Deja tu reseña · Queen Spiritual</title>
<meta name="description" content="Cuéntame cómo fue tu arreglo o tu lectura de cartas. Tu opinión ayuda a otras personas a conocerme.">
<meta property="og:title" content="Deja tu reseña · Queen Spiritual">
<meta property="og:description" content="Cuéntame cómo fue tu arreglo o tu lectura de cartas. ¡Me encantaría saber tu opinión! 💛">
<meta property="og:image" content="/images/compartir.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/iconos/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
<meta name="theme-color" content="#1A2340">
<link rel="stylesheet" href="/estilo.css">
<script src="/resenas.js"></script>
<style>
body{background:var(--night);color:var(--night-ink);min-height:100dvh}
.top{display:flex;justify-content:center;padding:22px 16px 6px}
.top .brand{color:var(--night-ink)}
main{max-width:540px;margin:0 auto;padding:10px 16px 48px}
.intro{text-align:center;margin:10px 0 18px}
.intro .kicker{display:block;font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.intro h1{font-size:clamp(2.2rem,8vw,3rem);margin:0 0 10px}
.intro p{color:var(--night-muted);line-height:1.6;margin:0}
.caja{background:var(--surface);color:var(--ink);border-radius:20px;padding:20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35);border:1.5px solid rgba(255,217,102,.5)}
.caja .done{text-align:center;padding:14px 0}
.caja .done h4{font-family:"Cormorant",Georgia,serif;font-size:2rem;margin:0 0 8px}
.caja .done p{color:var(--muted)}
.caja .done .btn{margin-top:14px}
.pie{text-align:center;margin-top:22px;font-size:.92rem}
.pie a{color:#FFD966}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/" id="brandName">Queen Spiritual</a></header>
<main>
  <div class="intro">
    <span class="kicker">Tu opinión es muy importante</span>
    <h1>Deja tu reseña</h1>
    <p>Gracias por confiar en mí 💛 Cuéntame cómo fue tu arreglo o tu lectura de cartas. Si quieres, agrega una foto.</p>
  </div>
  <div class="caja" id="caja"></div>
  <p class="pie"><a href="/">Ver la página de Queen Spiritual</a></p>
</main>
<script>
// Enlace para mandarle a tus clientas: /resena.html  (o /resena.html?tipo=lectura para que salga marcada "lectura de cartas").
const q = new URLSearchParams(location.search), t = (q.get("tipo") || "").toLowerCase();
const tipo = /^lect|cart/.test(t) ? "Lecturas" : "Arreglos";
document.getElementById("caja").append(Resenas.formulario({ tipo, alTerminar: ok => { const a = document.createElement("a"); a.className = "btn btn-solid"; a.href = "/#resenas"; a.textContent = "Ver las reseñas"; ok.append(a); } }));
fetch("/api/contenido?n=negocio").then(r => r.ok ? r.json() : {}).then(N => { if (N && N.nombre) document.getElementById("brandName").textContent = N.nombre; }).catch(() => {});
</script>
<script src="/stats.js" defer></script>
</body>
</html>
