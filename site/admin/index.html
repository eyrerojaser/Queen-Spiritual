<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Queen Spiritual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" href="/iconos/panel-192.png" type="image/png">
<link rel="apple-touch-icon" href="/iconos/panel-apple-touch-icon.png">
<meta name="theme-color" content="#C9A24A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel Queen">
<link rel="stylesheet" href="/estilo.css">
<script src="/mes.js"></script>
<style>
body{font-size:16px}
[hidden]{display:none!important}
input,select,textarea{box-sizing:border-box;max-width:100%}
details.card > div{min-width:0}
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:"Cormorant",Georgia,serif;font-size:1.45rem;font-weight:600;color:var(--ink);text-decoration:none;line-height:1}
.logo small{display:block;font-family:"Figtree",sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.bar nav{display:flex;gap:8px}
.lnk{font:inherit;font-size:.92rem;font-weight:600;color:var(--blue);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none}
main{max-width:1080px;margin:0 auto;padding:24px 18px 120px}
h1{font-size:clamp(2rem,6vw,2.6rem);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 26px;max-width:60ch}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;margin-bottom:14px}
.group{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(36,64,127,.08)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.tile b{display:block;font-size:1.05rem;font-weight:700}
.tile span{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.tile .ico{display:grid;margin:0}
.badge{position:absolute;top:12px;right:12px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--gold);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin:4px 6px 0 0}
.pill.off{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.rv-pend{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.rv-pend > a{flex:none}
.rv-pend img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.estado-card{display:flex;align-items:center;justify-content:space-between;gap:14px 18px;flex-wrap:wrap}
.estado-card > div{flex:1;min-width:200px}
.onoff{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:1rem;padding:13px 22px 13px 16px;border-radius:999px;border:0;color:#fff;cursor:pointer;min-height:50px;transition:background .2s}
.onoff i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9)}
.onoff.on{background:#2563EB;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.onoff.off{background:#DC2626;box-shadow:0 6px 18px rgba(220,38,38,.35)}
.onoff[disabled]{opacity:.7}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:.82rem;font-weight:600;color:var(--muted)}
.kpi b{font-size:1.9rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{font-size:.78rem;color:var(--muted)}
.kpi .pill{align-self:flex-start;margin:4px 0 0}
.ch{position:relative;display:grid;grid-template-columns:auto 1fr;gap:8px;height:190px}
.ch-y{display:flex;flex-direction:column;justify-content:space-between;font-size:.72rem;color:var(--muted);text-align:right;padding-bottom:1px}
.ch-area{position:relative;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),color-mix(in srgb,var(--line) 70%,transparent) calc(25% - 1px),color-mix(in srgb,var(--line) 70%,transparent) 25%)}
.ch-cols{position:absolute;inset:0;display:flex;align-items:flex-end}
.ch-col{flex:1;height:100%;display:flex;align-items:flex-end;padding:0;border:0;background:none;cursor:pointer;min-width:0}
.ch-col i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;transition:opacity .15s}
.ch-col:hover i,.ch-col:focus i{opacity:.75}
.ch-tip{position:absolute;top:0;right:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 11px;font-size:.82rem;display:flex;flex-direction:column;pointer-events:none}
.ch-x{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin:4px 0 0 calc(2ch + 8px)}
.hb{display:grid;gap:12px}
.hb-t{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;margin-bottom:4px}
.hb-t b{font-variant-numeric:tabular-nums}
.hb-b{height:8px;border-radius:4px;background:var(--blue-soft);overflow:hidden}
.hb-b i{display:block;height:100%;background:var(--blue);border-radius:4px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dos > .card{margin-bottom:16px}
.tabla-w{overflow-x:auto;margin:0 -4px}
.tabla{width:100%;border-collapse:collapse;font-size:.9rem}
.tabla th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tabla td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tabla td:first-child{font-weight:600;min-width:140px}
.fotos-ed{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.fe{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--blue-soft)}
.fe img{width:100%;height:100%;object-fit:cover}
.fe .ib{position:absolute;top:4px;right:4px;width:26px;height:26px;min-width:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:1rem;line-height:1;padding:0}
.card.pend{border-color:var(--gold)}
.resps{display:grid;gap:8px;margin-top:12px;border-left:3px solid var(--line);padding-left:12px}
.resp.rep{background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:8px;padding:6px 8px}
.resp.hid{opacity:.6}
.pill.prog{background:color-mix(in srgb,var(--gold) 22%,transparent);color:#7A5B0E}
.card.hid{opacity:.65}
.rw{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.rw .pill{margin:0}
.sec-t{font-family:"Figtree",sans-serif;font-size:1.05rem;font-weight:700;margin:22px 0 12px}
.enc-g{display:grid;grid-template-columns:auto auto 1fr;gap:8px;margin-top:10px}
.enc-g input[type=url]{grid-column:1/-1}
.card.mb{margin-bottom:0}
@media (max-width:720px){.dos{grid-template-columns:1fr;gap:0}.enc-g{grid-template-columns:1fr 1fr}.enc-g input[type=text]{grid-column:1/-1}.kpi b{font-size:1.6rem}}
.card h2{font-family:"Figtree",sans-serif;font-size:1.1rem;font-weight:700;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
/* formularios */
.f{display:grid;gap:16px}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lab{font-weight:600;font-size:.92rem}
.hint{color:var(--muted);font-size:.84rem;margin-top:-2px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=tel],input[type=url],input[type=search],select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.money{position:relative}.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money input{padding-left:26px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0;cursor:pointer}
.sw span{font-weight:600;font-size:.95rem}
.sw small{display:block;color:var(--muted);font-weight:400;font-size:.84rem}
.sw input{appearance:none;flex:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked{background:var(--blue)}.sw input:checked::after{transform:translateX(20px)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:.92rem;font-weight:600;padding:10px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--bg)}
.up{display:flex;gap:14px;align-items:center}
.up .pv{width:84px;height:104px;border-radius:12px;background:var(--blue-soft);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--blue);font-size:.8rem;text-align:center}
.up .pv img{width:100%;height:100%;object-fit:cover}
.up .acts{display:flex;flex-wrap:wrap;gap:8px}
.file{display:flex;gap:10px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:.92rem}
.file b{word-break:break-all}
progress{width:100%;height:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save-bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;display:flex;gap:10px}
.danger{border-color:var(--warn);color:var(--warn);background:transparent}
/* listas */
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.item.hid{opacity:.6}
.th{width:56px;height:70px;border-radius:10px;background:var(--blue-soft);overflow:hidden;display:grid;place-items:center;color:var(--blue);font-family:"Cormorant",Georgia,serif;font-size:1.5rem;font-weight:600}
.th img{width:100%;height:100%;object-fit:cover}
.item .nm{font-weight:700;line-height:1.25}
.item .ds{color:var(--muted);font-size:.88rem}
.item .open{all:unset;cursor:pointer;display:block}
.item .open:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.ia{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:inherit}
.ib svg{width:18px;height:18px}
.ib[disabled]{opacity:.35;cursor:default}
.add{margin-top:14px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center}
/* calendario */
.wk{display:grid;gap:10px}
.wd{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.wd:last-child{border-bottom:0}
.wd .dn{display:flex;align-items:center;gap:10px;font-weight:700;padding-top:8px}
.blk{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.blk input{max-width:140px}
.closed{color:var(--muted);padding-top:9px;font-size:.92rem}
.lst{display:grid;gap:8px}
.lst .r{display:flex;gap:8px;align-items:center}
.lst .r input[type=date]{max-width:180px}
/* reservas */
.day{font-family:"Cormorant",Georgia,serif;font-size:1.5rem;margin:22px 0 10px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:grid;gap:6px}
.bk .rw{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.bk .when{font-weight:700;color:var(--blue)}
.bk .nota{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.92rem}
.bk.conf{border-color:var(--warn)}
.bk ul{margin:0;padding-left:18px}
/* diálogo */
dialog{border:0;padding:0;border-radius:18px;width:min(620px,calc(100vw - 20px));max-height:calc(100dvh - 20px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(14,19,38,.55)}
.dl{display:flex;flex-direction:column;max-height:calc(100dvh - 20px)}
.dl header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dl header h2{font-family:"Figtree",sans-serif;font-size:1.15rem;font-weight:700}
.dl .bd{padding:20px;overflow:auto}
.dl footer{display:flex;gap:10px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dl footer .r{display:flex;gap:10px;margin-left:auto}
.x{background:none;border:0;font-size:1.7rem;line-height:1;color:var(--muted);cursor:pointer;padding:2px 8px}
/* entrada */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login .box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px}
.login h1{font-size:2.2rem;margin:0}
.login .tag2{color:var(--gold);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin:4px 0 22px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--blue);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;padding:6px 8px}
.wide{width:100%}
.spin{color:var(--muted);padding:30px 0}
@media (max-width:640px){
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{grid-template-columns:1fr;gap:10px;padding:16px}
  .tile span{font-size:.82rem}
  .wd{grid-template-columns:1fr;gap:4px}
  .wd .dn{padding-top:0}
  .row2{grid-template-columns:1fr}
  .item{grid-template-columns:48px 1fr;}
  .item .ia{grid-column:1/-1;justify-content:flex-end}
  .th{width:48px;height:60px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  .dl{height:100dvh;max-height:100dvh}
  .dl .bd{flex:1}
  .bar nav .lnk.hide-sm{display:none}
}

/* ═════ Private Reading Room ═════ */
body.modo-sala main{max-width:1400px;padding-top:14px}
.rr{--rr-azul:#141B33;--rr-azul2:#24407F;--rr-oro:#D4AE52;--rr-amarillo:#FFD966}
.rr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.rr-top .back{margin:0}
.rr-t{flex:1;min-width:0;text-align:center}.rr-t b{display:block;font-family:"Cormorant",Georgia,serif;font-size:1.5rem;line-height:1.1}.rr-t span{font-size:.85rem;color:var(--muted)}
.rr-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.rr-izq{position:relative}
.rr-video{position:relative;background:radial-gradient(120% 120% at 50% 0%,#2E4F9A 0%,#1A2340 55%,#0F1428 100%);border:1.5px solid var(--rr-oro);border-radius:18px;overflow:hidden;aspect-ratio:16/10;min-height:340px;box-shadow:0 14px 40px rgba(20,27,51,.25)}
.rr-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rr-portada{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff;padding:24px}
.rr-portada h2{font-family:"Cormorant",Georgia,serif;font-size:2.2rem;margin:0;color:#fff}
.rr-portada p{margin:0;color:#D9DFF0}.rr-portada small{color:#AEB8D8;margin-top:6px}
.rr-oro{background:linear-gradient(100deg,var(--rr-amarillo),#E9B949);color:#1A2340;border:0;font-weight:700;padding:14px 22px;border-radius:999px;margin-top:10px;box-shadow:0 8px 22px rgba(255,217,102,.25);text-decoration:none}
.rr-k{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rr-oro);margin-bottom:8px}
.rr-der{display:grid;gap:14px}
.rr-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.rr-card summary{cursor:pointer;font-weight:700}
.rr-card textarea{width:100%;min-height:180px}
.rr-timer{background:linear-gradient(160deg,#1A2340,#24407F);color:#fff;border-color:var(--rr-oro);transition:box-shadow .4s}
.rr-reloj{font-family:"Cormorant",Georgia,serif;font-size:4rem;font-weight:600;line-height:1;text-align:center;color:var(--rr-amarillo);font-variant-numeric:tabular-nums;margin:4px 0 10px}
.rr-barra{height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.rr-barra i{display:block;height:100%;background:linear-gradient(90deg,var(--rr-amarillo),var(--rr-oro));transition:width .5s linear}
.rr-est{text-align:center;font-size:.9rem;color:#D9DFF0;margin:10px 0 12px;min-height:1.2em}
.rr-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rr-timer .btn-line{color:#fff;border-color:rgba(255,255,255,.5);background:transparent}
.rr-timer .btn-solid{background:var(--rr-amarillo);color:#1A2340;border-color:var(--rr-amarillo)}
.rr-min{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:.85rem;color:#D9DFF0}
.rr-min input{background:rgba(255,255,255,.95);color:#1A2340;padding:7px 10px}
.rr-timer.aviso{box-shadow:0 0 0 3px var(--rr-amarillo),0 0 28px rgba(255,217,102,.55);animation:rrLatido 2.4s ease-in-out infinite}
.rr-timer.fin .rr-reloj{color:#FFB4A8}
.rr-aviso .rr-video{border-color:var(--rr-amarillo);box-shadow:0 0 0 2px var(--rr-amarillo),0 0 30px rgba(255,217,102,.35)}
@keyframes rrLatido{50%{box-shadow:0 0 0 3px var(--rr-amarillo),0 0 46px rgba(255,217,102,.8)}}
.rr-sit{white-space:pre-wrap;font-size:.92rem;margin:10px 0}
.rr-nota{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:.88rem}.rr-nota p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap}
.lnkx{display:inline-block;margin-top:10px;font-weight:600;color:var(--blue)}
/* Muñequita mística */
.muneca{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;align-items:flex-end;gap:6px;pointer-events:auto;max-width:calc(100% - 28px)}
.muneca.entra{animation:mEntra .9s cubic-bezier(.2,.8,.2,1.2) both}
.muneca-fig{width:130px;flex:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.muneca-svg{width:100%;height:auto;display:block}
.muneca-svg .m-cuerpo{animation:mFlota 3.2s ease-in-out infinite;transform-origin:60px 140px}
.muneca-svg .m-ojos{animation:mParpadea 4s infinite;transform-origin:60px 52px}
.muneca-svg .m-bola{animation:mBrilla 2s ease-in-out infinite}
.muneca-svg .m-chispas path{animation:mChispa 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.muneca-svg .m-chispas .c2{animation-delay:.6s}.muneca-svg .m-chispas .c3{animation-delay:1.2s}
.muneca-svg .m-est{animation:mChispa 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.muneca-svg .e2{animation-delay:1s}

async function vistaForm({ n, titulo, lead, secciones, preparar = d => d, armar }) {
  cargando();
  const doc = await leer(n);
  const fs = secciones.map(([t, sub, defs, ruta]) => {
    const base = ruta ? (doc[ruta] || {}) : doc;
    const fm = formulario(defs, base);
    return { t, sub, fm, ruta };
  });
  const b = h("button", { class: "btn btn-solid", type: "button" }, "Guardar cambios");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Guardando…";
    const nuevo = clon(doc);
    // Cada sección guarda solo sus propios campos (así una sección no pisa lo que cambiaste en otra).
    const propios = fm => { const v = fm.valores(), o = {}; fm.campos.forEach(c => { o[c.def.k] = v[c.def.k]; if (c.extra) Object.assign(o, c.extra()); }); return o; };
    fs.forEach(({ fm, ruta }) => { if (ruta) nuevo[ruta] = { ...(nuevo[ruta] || {}), ...propios(fm) }; else Object.assign(nuevo, propios(fm)); });
    try { await guardar(n, armar ? armar(nuevo) : nuevo); } catch (e) { fallo(e); }
    b.disabled = false; b.textContent = "Guardar cambios";
  };
  marco(...cabeza(titulo, lead), fs.map(({ t, sub, fm }) => h("div", { class: "card" }, h("h2", null, t), sub ? h("p", { class: "sub" }, sub) : null, fm.nodo)), h("div", { class: "save-bar" }, b));
}

  catch (e) { if (!(e instanceof Salir)) marco(...cabeza("Algo salió mal"), h("p", { class: "note err" }, e.message), h("button", { class: "btn btn-solid", type: "button", onclick: ruta }, "Intentar de nuevo")); }
}
window.addEventListener("hashchange", ruta);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
(async () => {
  try {
    const r = await fetch("/api/panel/entrar", { credentials: "same-origin" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { pantallaEntrar(d.error); return; }
    d.sesion ? ruta() : pantallaEntrar();
  } catch (e) { pantallaEntrar("No hay conexión. Revisa tu internet."); }
})();
