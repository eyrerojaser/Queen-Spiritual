<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Queen Spiritual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/admin/manifest.webmanifest">

<link rel="apple-touch-icon" href="/iconos/panel-apple-touch-icon.png">

<style>
body{font-size:16px}
[hidden]{display:none!important}
input,select,textarea{box-sizing:border-box;max-width:100%}
details.card > div{min-width:0}
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:"Cormorant",Georgia,serif;font-size:1.45rem;font-weight:600;color:var(--ink);text-decoration:none;line-height:1}
.logo small{display:block;font-family:"Figtree",sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.bar nav{display:flex;gap:8px}
.lnk{font:inherit;font-size:.92rem;font-weight:600;color:var(--blue);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none}
main{max-width:1080px;margin:0 auto;padding:24px 18px 120px}
h1{font-size:clamp(2rem,6vw,2.6rem);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 26px;max-width:60ch}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;margin-bottom:14px}
.group{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(36,64,127,.08)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.tile b{display:block;font-size:1.05rem;font-weight:700}
.tile span{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.tile .ico{display:grid;margin:0}
.badge{position:absolute;top:12px;right:12px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--gold);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin:4px 6px 0 0}
.pill.off{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.rv-pend{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.rv-pend > a{flex:none}
.rv-pend img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.estado-card{display:flex;align-items:center;justify-content:space-between;gap:14px 18px;flex-wrap:wrap}
.estado-card > div{flex:1;min-width:200px}
.onoff{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:1rem;padding:13px 22px 13px 16px;border-radius:999px;border:0;color:#fff;cursor:pointer;min-height:50px;transition:background .2s}
.onoff i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9)}
.onoff.on{background:#2563EB;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.onoff.off{background:#DC2626;box-shadow:0 6px 18px rgba(220,38,38,.35)}
.onoff[disabled]{opacity:.7}
.card h2{font-family:"Figtree",sans-serif;font-size:1.1rem;font-weight:700;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
/* formularios */
.f{display:grid;gap:16px}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lab{font-weight:600;font-size:.92rem}
.hint{color:var(--muted);font-size:.84rem;margin-top:-2px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=tel],input[type=url],select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.money{position:relative}.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money input{padding-left:26px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0;cursor:pointer}
.sw span{font-weight:600;font-size:.95rem}
.sw small{display:block;color:var(--muted);font-weight:400;font-size:.84rem}
.sw input{appearance:none;flex:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked{background:var(--blue)}.sw input:checked::after{transform:translateX(20px)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:.92rem;font-weight:600;padding:10px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--bg)}
.up{display:flex;gap:14px;align-items:center}
.up .pv{width:84px;height:104px;border-radius:12px;background:var(--blue-soft);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--blue);font-size:.8rem;text-align:center}
.up .pv img{width:100%;height:100%;object-fit:cover}
.up .acts{display:flex;flex-wrap:wrap;gap:8px}
.file{display:flex;gap:10px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:.92rem}
.file b{word-break:break-all}
progress{width:100%;height:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save-bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;display:flex;gap:10px}
.danger{border-color:var(--warn);color:var(--warn);background:transparent}
/* listas */
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.item.hid{opacity:.6}
.th{width:56px;height:70px;border-radius:10px;background:var(--blue-soft);overflow:hidden;display:grid;place-items:center;color:var(--blue);font-family:"Cormorant",Georgia,serif;font-size:1.5rem;font-weight:600}
.th img{width:100%;height:100%;object-fit:cover}
.item .nm{font-weight:700;line-height:1.25}
.item .ds{color:var(--muted);font-size:.88rem}
.item .open{all:unset;cursor:pointer;display:block}
.item .open:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.ia{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:inherit}
.ib svg{width:18px;height:18px}
.ib[disabled]{opacity:.35;cursor:default}
.add{margin-top:14px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center}
/* calendario */
.wk{display:grid;gap:10px}
.wd{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.wd:last-child{border-bottom:0}
.wd .dn{display:flex;align-items:center;gap:10px;font-weight:700;padding-top:8px}
.blk{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.blk input{max-width:140px}
.closed{color:var(--muted);padding-top:9px;font-size:.92rem}
.lst{display:grid;gap:8px}
.lst .r{display:flex;gap:8px;align-items:center}
.lst .r input[type=date]{max-width:180px}
/* reservas */
.day{font-family:"Cormorant",Georgia,serif;font-size:1.5rem;margin:22px 0 10px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:grid;gap:6px}
.bk .rw{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.bk .when{font-weight:700;color:var(--blue)}
.bk .nota{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.92rem}
.bk.conf{border-color:var(--warn)}
.bk ul{margin:0;padding-left:18px}
/* diálogo */
dialog{border:0;padding:0;border-radius:18px;width:min(620px,calc(100vw - 20px));max-height:calc(100dvh - 20px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(14,19,38,.55)}
.dl{display:flex;flex-direction:column;max-height:calc(100dvh - 20px)}
.dl header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dl header h2{font-family:"Figtree",sans-serif;font-size:1.15rem;font-weight:700}
.dl .bd{padding:20px;overflow:auto}
.dl footer{display:flex;gap:10px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dl footer .r{display:flex;gap:10px;margin-left:auto}
.x{background:none;border:0;font-size:1.7rem;line-height:1;color:var(--muted);cursor:pointer;padding:2px 8px}
/* entrada */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login .box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px}
.login h1{font-size:2.2rem;margin:0}
.login .tag2{color:var(--gold);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin:4px 0 22px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--blue);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;padding:6px 8px}
.wide{width:100%}
.spin{color:var(--muted);padding:30px 0}
@media (max-width:640px){
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{grid-template-columns:1fr;gap:10px;padding:16px}
  .tile span{font-size:.82rem}
  .wd{grid-template-columns:1fr;gap:4px}
  .wd .dn{padding-top:0}
  .row2{grid-template-columns:1fr}
  .item{grid-template-columns:48px 1fr;}
  .item .ia{grid-column:1/-1;justify-content:flex-end}
  .th{width:48px;height:60px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  .dl{height:100dvh;max-height:100dvh}
  .dl .bd{flex:1}
  .bar nav .lnk.hide-sm{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><div class="dl" id="dlgIn"></div></dialog>

<script>
/* ═════════ Utilidades ═════════ */
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else if (k in e && typeof v !== "string") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const s = v => (typeof v === "string" ? v.trim() : v == null ? "" : String(v));
const dinero = n => "$" + (Number(n) % 1 ? Number(n).toFixed(2) : Number(n || 0).toFixed(0));
const clon = o => JSON.parse(JSON.stringify(o));
function toast(m, tipo) { document.querySelectorAll(".toast").forEach(t => t.remove()); const t = h("div", { class: "toast", role: "status" }, m); if (tipo === "err") t.style.background = "var(--warn)"; document.body.append(t); setTimeout(() => t.remove(), 3500); }
const ICON = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 13l2.5-7.5h11L20 13v5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="4" width="11" height="15" rx="2" transform="rotate(8 13.5 11.5)"/><rect x="4.5" y="5" width="11" height="15" rx="2" transform="rotate(-6 10 12.5)"/></svg>',
  flower: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="9" r="2.2"/><path d="M12 6.8c0-2.6 3.6-2.6 3.6 0 2.6 0 2.6 3.6 0 3.6M12 6.8c0-2.6-3.6-2.6-3.6 0-2.6 0-2.6 3.6 0 3.6M8.4 10.4c-2 1.6.4 4.4 2.3 2.4M15.6 10.4c2 1.6-.4 4.4-2.3 2.4M12 11.2V21M12 17c-2.5 0-4-1.5-4.5-3.5M12 18.5c2.5 0 4-1.5 4.5-3.5"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 7.5h14l-1.1 11.6a1.5 1.5 0 0 1-1.5 1.4H7.6a1.5 1.5 0 0 1-1.5-1.4z"/><path d="M9 7.5V6.5a3 3 0 0 1 6 0v1"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.4 1.4 0 0 1 0 2l-6.6 6.6a1.4 1.4 0 0 1-2 0z"/><circle cx="8" cy="8" r="1.4"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.5l-5 2.7 1-5.6-4.1-3.9 5.6-.7z"/></svg>',
  store: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9.5V20h16V9.5M3 9.5l1.6-5h14.8l1.6 5a2.6 2.6 0 0 1-4.5 1.8 2.6 2.6 0 0 1-4.5 0 2.6 2.6 0 0 1-4.5 0A2.6 2.6 0 0 1 3 9.5z"/><path d="M9.5 20v-5h5v5"/></svg>',
  clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 4.5V3.5h6v1M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l7 2.8v5.2c0 4.3-3 7.6-7 9-4-1.4-7-4.7-7-9V6.3z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>',
  bouquet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="2.6"/><circle cx="16" cy="7" r="2.6"/><circle cx="12" cy="5" r="2.6"/><path d="M6.5 11h11l-3.5 9.5h-4z"/><path d="M12 7.6V11M8.8 9.2 10 11M15.2 9.2 14 11"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6 6 6-6"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>',
  eyeoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l16 16M10 5.7A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.4 7.4C3.9 9.2 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1.1M9.9 10a2.8 2.8 0 0 0 4 4"/></svg>',
};
const ico = k => h("span", { class: "ico", html: ICON[k] });

/* ═════════ Instalar como aplicación ═════════ */
let avisoInstalar = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); avisoInstalar = e; const t = document.getElementById("instalar"); if (t) t.replaceWith(tarjetaInstalar()); });
addEventListener("appinstalled", () => { avisoInstalar = null; const t = document.getElementById("instalar"); if (t) t.remove(); toast("Panel instalado ✓"); });
const instalada = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
/* ═════════ Notificaciones en este equipo ═════════ */
const b64aU8 = b => { const p = "=".repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(r, c => c.charCodeAt(0)); };
function tarjetaAvisos() {
  const soporta = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const card = h("div", { class: "card", id: "avisos", style: "display:flex;gap:14px;align-items:center;flex-wrap:wrap" });
  const txt = h("p", { class: "sub", style: "margin:0 0 8px" });
  const btn = h("button", { class: "btn btn-solid btn-sm", type: "button" }, "Activar notificaciones");
  const cuerpo = h("div", { style: "flex:1;min-width:200px" }, h("h2", null, "🔔 Avisos en este teléfono"), txt);
  card.append(cuerpo);
  if (!soporta) {
    txt.textContent = ios && !instalada() ? "En iPhone, primero instala el panel (Compartir → Agregar a inicio) y ábrelo desde ese ícono. Ahí podrás activar los avisos." : "Este navegador no permite notificaciones. Prueba con Chrome o con el panel instalado.";
    return card;
  }
  const activar = async (probar) => {
    btn.disabled = true; btn.textContent = "Activando…";
    try {
      const permiso = await Notification.requestPermission();
      if (permiso !== "granted") throw new Error("No diste permiso. Puedes activarlo en los ajustes del navegador para este sitio.");
      const reg = await navigator.serviceWorker.ready;
      const { clave } = await api("/api/panel/push");
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aU8(clave) });
      await api("/api/panel/push", { method: "POST", body: { sub: sub.toJSON(), probar } });
      pintar(true); if (probar) toast("Listo: te mandé un aviso de prueba ✓");
    } catch (e) { fallo(e); pintar(false); }
  };
  const pintar = (on) => {

  let cerrados = clon(doc.cerrados || []), especiales = clon(doc.especiales || []);
  const gen = formulario([
    { k: "reservasActivas", t: "bool", label: "Aceptar reservas", hint: "Apágalo para cerrar todas las reservas (vacaciones, descanso). Las citas ya pagadas se quedan." },
    { k: "duracion", t: "num", label: "Cada cita ocupa (minutos)", min: 15, hint: "Incluye tu descanso entre lecturas. Ej: lectura de 45 + 15 de descanso = 60." },
    { k: "avisoHoras", t: "num", label: "Aviso mínimo (horas)", min: 0, hint: "Ej: 12 = nadie puede reservar para dentro de menos de 12 horas." },
    { k: "anticipacionDias", t: "num", label: "Se puede reservar hasta (días adelante)", min: 1 },
  ], doc);
  const HORAS = []; for (let m = 0; m < 24 * 60; m += 30) HORAS.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
  const bonita = x => { let [H, M] = x.split(":").map(Number); const ap = H < 12 ? "a. m." : "p. m."; H = H % 12 || 12; return `${H}:${String(M).padStart(2, "0")} ${ap}`; };
  const hora = (v, on) => {
    const lista = v && !HORAS.includes(v) ? [...HORAS, v].sort() : HORAS;
    const i = h("select", { "aria-label": "Hora", style: "width:auto;min-width:122px" }, lista.map(x => h("option", { value: x, selected: x === v }, bonita(x))));
    i.onchange = () => on(i.value); return i;
  };
  const semana = h("div", { class: "wk" });
  const pintarSemana = () => semana.replaceChildren(...DIAS.map(([d, nombre]) => {
    const bl = sem[d], abierto = bl.length > 0;
    const sw = h("input", { type: "checkbox", checked: abierto, role: "switch", "aria-label": `${nombre}: trabajo` });
    sw.onchange = () => { sem[d] = sw.checked ? [{ desde: "06:00", hasta: "20:00" }] : []; pintarSemana(); };
    const lado = abierto ? h("div", null, bl.map((b, i) => h("div", { class: "blk" }, hora(b.desde, v => b.desde = v), h("span", { class: "muted" }, "a"), hora(b.hasta, v => b.hasta = v),
        bl.length > 1 ? h("button", { class: "ib", type: "button", "aria-label": "Quitar horario", onclick: () => { bl.splice(i, 1); pintarSemana(); } }, "×") : null)),
      h("button", { class: "lnk", type: "button", style: "font-size:.85rem;padding:6px 12px", onclick: () => { bl.push({ desde: "16:00", hasta: "19:00" }); pintarSemana(); } }, "+ Otro horario ese día"),
      h("button", { class: "lnk", type: "button", style: "font-size:.85rem;padding:6px 12px", onclick: () => { DIAS.forEach(([o]) => { sem[o] = bl.map(x => ({ ...x })); }); pintarSemana(); toast("Listo: los 7 días tienen este horario. Toca Guardar calendario."); } }, "Usar este horario todos los días"))
      : h("div", { class: "closed" }, "No trabajo");
    return h("div", { class: "wd" }, h("label", { class: "dn sw", style: "justify-content:flex-start" }, sw, nombre), lado);
  }));
  pintarSemana();
  const listaFechas = (arr, conHoras, vacio, boton) => {
    const caja = h("div", { class: "lst" });
    const pintar = () => caja.replaceChildren(
      ...(arr.length ? arr.map((x, i) => {
        const f = h("input", { type: "date", value: x.fecha || "", "aria-label": "Fecha", oninput: e => x.fecha = e.target.value });
        return h("div", { class: "r" }, f,
          conHoras ? [hora(x.desde, v => x.desde = v), hora(x.hasta, v => x.hasta = v)] : h("input", { type: "text", value: x.motivo || "", placeholder: "Motivo (solo lo ves tú)", "aria-label": "Motivo", oninput: e => x.motivo = e.target.value }),
          h("button", { class: "ib", type: "button", "aria-label": "Quitar", onclick: () => { arr.splice(i, 1); pintar(); } }, "×"));
      }) : [h("p", { class: "muted", style: "margin:0" }, vacio)]),
      h("div", null, h("button", { class: "btn btn-line btn-sm", type: "button", onclick: () => { arr.push(conHoras ? { fecha: "", desde: "10:00", hasta: "14:00" } : { fecha: "", motivo: "" }); pintar(); } }, boton)));
    pintar(); return caja;
  };
  const err = h("p", { class: "note err", hidden: true });
  const b = h("button", { class: "btn btn-solid", type: "button", onclick: async () => {
    err.hidden = true;
    const semana2 = DIAS.flatMap(([d]) => sem[d].map(x => ({ dia: d, ...x })));
    const malo = semana2.find(x => !x.desde || !x.hasta || x.desde >= x.hasta) || especiales.find(x => x.fecha && (!x.desde || !x.hasta || x.desde >= x.hasta));
    if (malo) { err.textContent = "Revisa los horarios: la hora de inicio debe ser antes que la de fin."; err.hidden = false; return; }
    b.disabled = true;
    try { await guardar("horario", { ...gen.valores(), semana: semana2, cerrados: cerrados.filter(c => c.fecha), especiales: especiales.filter(e => e.fecha) }); } catch (e) { fallo(e); }
    b.disabled = false;
  } }, "Guardar calendario");
  marco(...cabeza("Mi calendario", "Cuándo te pueden reservar una lectura. Todas las horas son de Texas."),
    h("div", { class: "card" }, h("h2", null, "General"), gen.nodo),
    h("div", { class: "card" }, h("h2", null, "Mi semana"), h("p", { class: "sub" }, "Los días y horas que trabajas normalmente."), semana),
    h("div", { class: "card" }, h("h2", null, "Días que NO trabajo"), h("p", { class: "sub" }, "Vacaciones, compromisos o días libres. Ese día no se puede reservar."), listaFechas(cerrados, false, "No tienes días bloqueados.", "+ Bloquear un día")),
    h("div", { class: "card" }, h("h2", null, "Días extra que SÍ trabajo"), h("p", { class: "sub" }, "Para abrir un día que normalmente no trabajas o cambiar el horario de una fecha."), listaFechas(especiales, true, "No tienes días extra.", "+ Agregar día extra")),
    err, h("div", { class: "save-bar" }, b));
}

/* ═════════ Políticas ═════════ */
async function politicas() {
  cargando();
  const [hor, pol] = await Promise.all([leer("horario"), leer("politicas")]);
  const can = formulario([
    { k: "cancelarDias", t: "num", label: "Días antes de la cita para cancelar con reembolso o cambiar", min: 0, hint: "1 = hasta el día anterior (el mismo día ya no se reembolsa). 0 = hasta el mismo día." },
    { k: "cambiosMax", t: "num", label: "Cuántas veces puede cambiar el día", min: 1 },
    { k: "politicaTexto", t: "area", label: "Texto de la política (opcional)", hint: "Si lo dejas vacío, se escribe solo según los días de arriba." },
  ], { cancelarDias: 1, cambiosMax: 2, ...hor });
  const tx = formulario([
    { k: "lecturas", t: "area", label: "Lecturas", rows: 4 },
    { k: "envios", t: "area", label: "Envíos y devoluciones", rows: 4 },
    { k: "arreglos", t: "area", label: "Arreglos y montajes", rows: 3 },
    { k: "privacidad", t: "area", label: "Privacidad", rows: 4 },
  ], pol);
  const b = h("button", { class: "btn btn-solid", type: "button", onclick: async () => {
    b.disabled = true;
    try { const v = can.valores(); await guardar("horario", { ...(await leer("horario")), ...v }); await guardar("politicas", tx.valores()); } catch (e) { fallo(e); }
    b.disabled = false;
  } }, "Guardar políticas");
  marco(...cabeza("Políticas", "Se ven en tu página (enlaces abajo, en el footer), al reservar y en los correos de confirmación."),
    h("div", { class: "card" }, h("h2", null, "Cancelaciones y cambios de citas"), h("p", { class: "sub" }, "El reembolso es automático cuando el cliente cancela dentro del plazo."), can.nodo),
    h("div", { class: "card" }, h("h2", null, "Otras políticas"), tx.nodo),
    h("p", null, h("a", { href: "/politicas.html", target: "_blank", rel: "noopener" }, "Ver la página de políticas")),
    h("div", { class: "save-bar" }, b));
}

/* ═════════ Contraseña ═════════ */
function clave() {
  const fm = formulario([
    { k: "actual", t: "text", label: "Contraseña actual" },
    { k: "nueva", t: "text", label: "Contraseña nueva", hint: "Al menos 8 caracteres." },
    { k: "repetir", t: "text", label: "Repite la contraseña nueva" },
  ], {});
  fm.campos.forEach(c => { c.input.type = "password"; c.input.autocomplete = c.def.k === "actual" ? "current-password" : "new-password"; });
  const err = h("p", { class: "note err", hidden: true });
  const b = h("button", { class: "btn btn-solid", type: "button", onclick: async () => {
    const v = fm.valores(); err.hidden = true;
    if (v.nueva !== v.repetir) { err.textContent = "Las contraseñas nuevas no son iguales."; err.hidden = false; return; }
    b.disabled = true;
    try { await api("/api/panel/clave", { method: "POST", body: { actual: v.actual, nueva: v.nueva } }); toast("Contraseña cambiada ✓"); location.hash = "#/"; }
    catch (e) { if (!(e instanceof Salir)) { err.textContent = e.message; err.hidden = false; } }
    b.disabled = false;
  } }, "Cambiar contraseña");
  marco(...cabeza("Contraseña", "Tu sesión dura 30 días en cada teléfono o computadora."), h("div", { class: "card" }, err, fm.nodo, h("div", { style: "margin-top:16px" }, b)),
    h("p", { class: "muted" }, "¿La olvidaste? En Netlify cambia la variable ADMIN_PASSWORD; esa vuelve a ser tu contraseña."));
}

/* ═════════ Rutas ═════════ */
const RUTAS = { "": inicio, encargos, flores, politicas, solicitudes, reservas, pedidos, calendario, lecturas, arreglos, tienda, categorias, resenas, negocio, clave };
async function ruta() {
  if (dlg.open) dlg.close();
  const r = (location.hash.replace(/^#\/?/, "") || "").split("?")[0];
  try { await (RUTAS[r] || inicio)(); }
  catch (e) { if (!(e instanceof Salir)) marco(...cabeza("Algo salió mal"), h("p", { class: "note err" }, e.message), h("button", { class: "btn btn-solid", type: "button", onclick: ruta }, "Intentar de nuevo")); }
}
window.addEventListener("hashchange", ruta);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
(async () => {
  try {
    const r = await fetch("/api/panel/entrar", { credentials: "same-origin" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { pantallaEntrar(d.error); return; }
    d.sesion ? ruta() : pantallaEntrar();
  } catch (e) { pantallaEntrar("No hay conexión. Revisa tu internet."); }
})();
</script>
