<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mi cita</title>
<link rel="icon" href="/iconos/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<script src="/mes.js"></script>
<style>
main{max-width:560px;margin:0 auto;padding:36px 20px 80px}
.brand{font-family:"Cormorant",Georgia,serif;font-size:1.4rem;font-weight:600;color:var(--ink);text-decoration:none}
h1{font-size:clamp(2.2rem,7vw,3rem);margin:26px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}
.big{font-family:"Cormorant",Georgia,serif;font-size:1.6rem;font-weight:600;margin:0 0 4px}
.card p{margin:0 0 6px}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.pill.off{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.slot{padding:10px 6px;font:inherit;font-weight:600;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer}
.slot[aria-pressed="true"]{background:var(--blue);color:var(--bg);border-color:var(--blue)}
.danger{border-color:var(--warn);color:var(--warn);background:transparent}
.politica{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <a class="brand" href="/" id="marca">Queen Spiritual</a>
  <div id="m"><p class="muted" style="margin-top:30px">Buscando tu cita…</p></div>
</main>
<script>
const m = document.getElementById("m");
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const token = new URLSearchParams(location.search).get("t") || "";
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
async function api(body) {
  const r = await fetch("/api/cita" + (body ? "" : "?t=" + encodeURIComponent(token)), body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: token, ...body }) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Algo salió mal. Intenta de nuevo.");
  return d;
}
fetch("/api/contenido?n=negocio").then(r => r.json()).then(N => { if (N.nombre) document.getElementById("marca").textContent = N.nombre; }).catch(() => {});

async function cargar(aviso) {
  let d;
  try { d = await api(); } catch (e) { m.replaceChildren(el("h1", null, "No encontré tu cita"), el("p", "muted", e.message)); return; }
  const c = el("div", "card");
  c.append(el("p", "big", d.lectura), el("p", null, `${cap(d.fechaBonita)} a las ${d.horaBonita} (hora de Texas)`), el("p", "muted", `Por videollamada · $${d.precio} pagado`));
  const out = [el("h1", null, d.estado === "cancelada" ? "Tu cita fue cancelada" : `Hola, ${d.nombre}`)];
  if (aviso) out.push(el("p", "note ok", aviso));
  if (d.estado === "cancelada") { c.prepend(el("span", "pill off", "Cancelada")); out.push(c, el("p", "muted", d.reembolso ? `Te devolví $${d.reembolso} a tu tarjeta.` : "Esta cancelación no tuvo reembolso.")); const a = el("a", "btn btn-solid", "Reservar otra cita"); a.href = "/lecturas.html"; out.push(a); m.replaceChildren(...out); return; }
  if (!d.activa) { c.prepend(el("span", "pill", "Ya pasó")); out.push(c); m.replaceChildren(...out); return; }
  c.prepend(el("span", "pill", "Reservada"));
  out.push(c);
  const acciones = el("div", "btns");
  if (d.puedeCambiar) { const b = el("button", "btn btn-solid", "Cambiar de día u hora"); b.type = "button"; b.onclick = () => cambiar(d); acciones.append(b); }
  const x = el("button", "btn danger", "Cancelar mi cita"); x.type = "button"; x.onclick = () => cancelar(d); acciones.append(x);
  out.push(acciones);
  if (!d.puedeCambiar) out.push(el("p", "muted", d.cambiosRestantes ? "Ya no se puede cambiar el día en línea. Si lo necesitas, contáctame." : "Ya usaste los cambios permitidos para esta cita."));
  const pol = el("div", "card politica"); pol.append(el("b", null, "Política de cancelación"), el("p", null, d.politica));
  out.push(pol);
  m.replaceChildren(...out);
}

function cancelar(d) {
  const msg = d.reembolsable ? `Se cancela tu cita y se te devuelven $${d.precio} a tu tarjeta.` : `Como es el mismo día de tu cita, el pago de $${d.precio} no es reembolsable.`;
  const c = el("div", "card");
  const si = el("button", "btn danger", "Sí, cancelar mi cita"), no = el("button", "btn btn-line", "No, mantener mi cita");
  si.type = no.type = "button";
  const err = el("p", "note err"); err.hidden = true;
  c.append(el("p", "big", "¿Cancelar tu cita?"), el("p", null, msg), err);
  const bs = el("div", "btns"); bs.append(si, no); c.append(bs);
  no.onclick = () => cargar();
  si.onclick = async () => { si.disabled = true; si.textContent = "Cancelando…"; try { const r = await api({ accion: "cancelar" }); cargar(r.reembolso ? `Tu cita quedó cancelada. Te devolví $${r.reembolso}.` : "Tu cita quedó cancelada."); } catch (e) { err.textContent = e.message; err.hidden = false; si.disabled = false; si.textContent = "Sí, cancelar mi cita"; } };
  m.replaceChildren(el("h1", null, "Cancelar cita"), c);
}

function cambiar(d) {
  if (!d.dias || !d.dias.length) { m.replaceChildren(el("h1", null, "Cambiar cita"), el("p", "muted", "Por ahora no hay otros horarios disponibles. Intenta más tarde o contáctame.")); return; }
  let dia = null, hora = null;
  const porFecha = new Map(d.dias.map(x => [x.fecha, x]));
  const slots = el("div", "slots"), conf = el("div"), err = el("p", "note err"); err.hidden = true;
  const cal = Mes({ min: d.dias[0].fecha, max: d.dias[d.dias.length - 1].fecha, mesInicial: d.fecha >= d.dias[0].fecha ? d.fecha : d.dias[0].fecha,
    tipo: f => porFecha.has(f) ? "libre" : "lleno", seleccion: f => dia && dia.fecha === f,
    alTocar: f => { dia = porFecha.get(f); hora = null; pintarHoras(); conf.replaceChildren(); } });
  function pintarHoras() {
    slots.replaceChildren(...dia.horas.map(h => { const b = el("button", "slot", h.etiqueta); b.type = "button"; b.setAttribute("aria-pressed", "false");
      b.onclick = () => { hora = h; slots.querySelectorAll(".slot").forEach(x => x.setAttribute("aria-pressed", String(x === b))); pintarConf(); }; return b; }));
  }
  function pintarConf() {
    const ok = el("button", "btn btn-solid", "Confirmar el cambio"); ok.type = "button";
    ok.onclick = async () => { ok.disabled = true; ok.textContent = "Cambiando…"; err.hidden = true;
      try { await api({ accion: "cambiar", fecha: dia.fecha, hora: hora.hora }); cargar("Listo: tu cita quedó cambiada. Te envié la confirmación por correo."); }
      catch (e) { err.textContent = e.message; err.hidden = false; ok.disabled = false; ok.textContent = "Confirmar el cambio"; } };
    conf.replaceChildren(el("p", null, `Nueva cita: ${dia.etiqueta}, ${hora.etiqueta}`), err, ok);
    conf.style.marginTop = "16px";
  }
  const volver = el("button", "btn btn-line", "Volver"); volver.type = "button"; volver.onclick = () => cargar();
  m.replaceChildren(el("h1", null, "Elige el nuevo día"), el("p", "muted", `Tu cita actual: ${cap(d.fechaBonita)} a las ${d.horaBonita}.`), cal.el, slots, conf, el("p", null), volver);
}
cargar();
</script>
<script src="/stats.js" defer></script>
</body>
</html>
