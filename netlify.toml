[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # El contenido inicial viaja con las funciones; lo que guardas en el panel queda en Netlify Blobs.
  included_files = ["site/content/**", "private/pdfs/**"]

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Enlace corto para pedir reseñas: queenspiritual.netlify.app/resena
[[redirects]]
  from = "/resena"
  to = "/resena.html"
  status = 200
